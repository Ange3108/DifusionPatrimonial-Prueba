<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Registros</title>
<link rel="stylesheet" href="estilo.css">
<style>
  header { text-align: center; padding: 34px 16px 6px; max-width: 900px; margin: 0 auto; }
  .sobre { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--borgona); }
  h1 { font-size: clamp(32px, 7vw, 56px); margin: 6px 0 4px; line-height: 1.05; font-weight: 900; }
  .sub { font-style: italic; color: var(--tinta-suave); margin: 0; }
  .buscar { max-width: 560px; margin: 18px auto 6px; padding: 0 16px; }
  .buscar input {
    width: 100%; padding: 11px 14px; font: 16px 'Special Elite', 'Courier New', monospace;
    color: var(--tinta); background: #fbf5e4; border: 2px solid var(--tinta); border-radius: 2px;
  }
  .buscar input::placeholder { color: var(--tinta-suave); }
  .buscar input:focus { outline: 3px solid var(--mostaza); outline-offset: 1px; }
  #cuenta { text-align: center; font-size: 13px; color: var(--tinta-suave); margin: 6px 0 0; }

  main {
    max-width: 1100px; margin: 0 auto; padding: 18px 16px 48px;
    display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  a.ficha {
    display: block; text-decoration: none; color: inherit; position: relative;
    background: #fbf5e4; padding: 10px;
    border: 1px solid var(--linea);
    box-shadow: 0 2px 5px rgba(60,40,20,.22);
    transition: transform .15s, box-shadow .15s;
  }
  a.ficha::before { /* marco interior de tarjeta antigua */
    content: ""; position: absolute; inset: 5px; border: 1px solid var(--tinta); pointer-events: none; opacity: .55;
  }
  a.ficha:hover, a.ficha:focus-visible { transform: translateY(-3px) rotate(-.4deg); box-shadow: 0 8px 16px rgba(60,40,20,.3); outline: none; }
  a.ficha:focus-visible { outline: 3px solid var(--mostaza); }
  a.ficha .foto { padding: 5px; box-shadow: none; }
  a.ficha img { aspect-ratio: 15 / 8; }
  .cuerpo { padding: 12px 8px 6px; }
  .num { font-size: 12px; color: var(--borgona); letter-spacing: .12em; }
  .nombre { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; line-height: 1.2; margin: 4px 0 10px; }
  .pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta-suave); }
  #vacio { text-align: center; color: var(--tinta-suave); font-style: italic; padding: 24px; display: none; }
  footer { text-align: center; padding: 0 16px 36px; }
</style>
</head>
<body>
<header>
  <div class="sobre maquina">— Archivo general —</div>
  <h1 class="titulo-display">Catálogo de Registros</h1>
  <p class="sub">Escanee el código QR o busque su registro</p>
  <hr class="filete">
</header>
<div class="buscar"><input id="q" type="search" placeholder="Buscar por título, departamento, estado…" aria-label="Buscar"></div>
<p id="cuenta" class="maquina"></p>
<main id="lista"></main>
<p id="vacio">No se encontraron registros.</p>
<footer><div class="estrella">✦ ✦ ✦</div></footer>

<script>
const lista = document.getElementById('lista');
const vacio = document.getElementById('vacio');
const cuenta = document.getElementById('cuenta');
let datos = [];

const clase = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-');

function pintar(items) {
  lista.innerHTML = '';
  vacio.style.display = items.length ? 'none' : 'block';
  cuenta.textContent = items.length + ' de ' + datos.length + ' registros';
  for (const d of items) {
    const a = document.createElement('a');
    a.className = 'ficha';
    a.href = 'detalle.html?id=' + encodeURIComponent(d.id);

    const foto = document.createElement('div'); foto.className = 'foto';
    const img = document.createElement('img'); img.src = d.imagen; img.alt = d.titulo; img.loading = 'lazy';
    foto.append(img);

    const cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
    const num = document.createElement('div'); num.className = 'num maquina'; num.textContent = 'N.º ' + String(d.id).padStart(3, '0');
    const nom = document.createElement('div'); nom.className = 'nombre'; nom.textContent = d.titulo;
    const pie = document.createElement('div'); pie.className = 'pie';
    const dep = document.createElement('span'); dep.textContent = d.departamento;
    const sello = document.createElement('span'); sello.className = 'sello ' + clase(d.estado); sello.textContent = d.estado;
    pie.append(dep, sello);

    cuerpo.append(num, nom, pie);
    a.append(foto, cuerpo);
    lista.append(a);
  }
}

document.getElementById('q').addEventListener('input', e => {
  const t = e.target.value.toLowerCase();
  pintar(datos.filter(d => [d.titulo, d.departamento, d.estado, d.prioridad].join(' ').toLowerCase().includes(t)));
});

fetch('datos.json').then(r => r.json()).then(j => { datos = j; pintar(datos); })
  .catch(() => { vacio.textContent = 'No se pudo cargar datos.json (abra el sitio desde GitHub Pages, no como archivo local).'; vacio.style.display = 'block'; });
</script>
</body>
</html>
